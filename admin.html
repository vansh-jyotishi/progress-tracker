<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Submissions Viewer</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .filter-bar {
            background: var(--surface-color);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--surface-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            flex-wrap: wrap;
        }

        .filter-bar select, .filter-bar input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        .filter-bar select:focus, .filter-bar input:focus {
            border-color: var(--primary-color);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .submission-card {
            background: var(--surface-color);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .submission-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .student-info {
            display: flex;
            flex-direction: column;
        }

        .student-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .assignment-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            align-self: flex-start;
        }

        .card-body {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .image-preview {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .submission-card:hover .image-preview img {
            transform: scale(1.05);
        }

        .no-image {
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .card-footer {
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .action-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            text-decoration: none;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .action-btn.primary {
            background: var(--primary-color);
        }

        .action-btn.primary:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="admin-header">
            <div class="logo-section" style="gap: 1rem;">
                <a href="task.html" style="color: var(--text-muted); display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); padding: 0.5rem; border-radius: 8px; transition: background 0.2s;"><i data-lucide="arrow-left"></i></a>
                <div>
                    <h1>Admin Panel</h1>
                    <p style="color: var(--text-muted);">Visual Submissions Viewer</p>
                </div>
            </div>
            <div id="submission-count" style="font-weight: 600; color: var(--success); background: rgba(16, 185, 129, 0.1); padding: 0.5rem 1rem; border-radius: 20px;">
                0 Submissions
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <i data-lucide="filter" style="color: var(--text-muted);"></i>
            <select id="filter-student">
                <option value="ALL">All Students</option>
            </select>
            <select id="filter-assignment">
                <option value="ALL">All Assignments</option>
            </select>
        </div>

        <!-- Gallery -->
        <div class="gallery-grid" id="gallery-container">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Custom JS -->
    <script src="admin.js"></script>
</body>
</html>
