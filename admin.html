<!DOCTYPE html>
<html>
<head>
<title>Admin Assignment Tracker</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:40px;
}

h1{text-align:center;}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#2c3e50;
color:white;
}

.complete{color:green;font-weight:bold;}
.incomplete{color:red;font-weight:bold;}

</style>
</head>

<body>

<h1>Assignment Tracker</h1>

<table id="tracker">

<thead>
<tr>
<th>Student</th>
<th>Java Setup</th>
<th>Hello World</th>
<th>Circle Program</th>
<th>Calculator</th>
<th>GitHub Repo</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQisfAjXtdhgNsKx0tRWZfxpKE3ZqnTko7Nza9JI0Kk5F4Syl58jky7G0iOoNy5L5Zzyr9jO16rX1Np/pub?gid=1152285208&single=true&output=csv";

const TASKS=[
"Java Setup",
"Hello World",
"Circle Program",
"Calculator",
"GitHub Repo"
];

let students={};

fetch(SHEET_URL)
.then(res=>res.text())
.then(data=>{

const rows=data.split("\n").slice(1);

rows.forEach(row=>{

const cols=row.split(",");

const name=cols[1];
const assignment=cols[3];

if(!name || !assignment) return;

if(!students[name]){
students[name]=new Set();
}

students[name].add(assignment);

});

buildTracker();

});


function buildTracker(){

const table=document.querySelector("#tracker tbody");

Object.keys(students).forEach(name=>{

const tr=document.createElement("tr");

let html=`<td>${name}</td>`;

TASKS.forEach(task=>{

if([...students[name]].some(a=>a.toLowerCase().includes(task.toLowerCase()))){
html+=`<td class="complete">✅</td>`;
}else{
html+=`<td class="incomplete">❌</td>`;
}

});

tr.innerHTML=html;

table.appendChild(tr);

});

}

</script>

</body>
</html>
