<!DOCTYPE html>
<html>
<head>
<title>Admin Assignment Tracker</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:40px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#2c3e50;
color:white;
}

.complete{
color:green;
font-weight:bold;
}

.incomplete{
color:red;
font-weight:bold;
}

</style>
</head>

<body>

<h1>Assignment Tracker</h1>

<table id="tracker">

<thead>
<tr>
<th>Student</th>
<th>Java Setup</th>
<th>Hello World</th>
<th>Circle Program</th>
<th>Basic Calculator</th>
<th>GitHub Upload</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

const sheetURL="PASTE_YOUR_CSV_LINK";

const assignments=[
"Java Setup",
"Hello World",
"Circle",
"Calculator",
"GitHub"
];

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

const rows=data.split("\n").slice(1);

let students={};

rows.forEach(row=>{

const cols=row.split(",");

const name=cols[1];
const assignment=cols[3];

if(!name) return;

if(!students[name]){
students[name]=new Set();
}

students[name].add(assignment);

});

const table=document.querySelector("#tracker tbody");

Object.keys(students).forEach(student=>{

const tr=document.createElement("tr");

let html=`<td>${student}</td>`;

assignments.forEach(task=>{

const match=[...students[student]].some(a =>
a.toLowerCase().includes(task.toLowerCase())
);

if(match){
html+=`<td class="complete">✅</td>`;
}else{
html+=`<td class="incomplete">❌</td>`;
}

});

tr.innerHTML=html;

table.appendChild(tr);

});

});

</script>

</body>
</html>
