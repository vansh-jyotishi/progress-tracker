<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Java Course Dashboard</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

select{
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

.progress{
height:22px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
background:#27ae60;
width:0%;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#2c3e50;
color:white;
}

.rank1{color:#e67e22;font-weight:bold;}
.rank2{color:#3498db;}
.rank3{color:#2ecc71;}

.badge{
font-size:22px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Java Course Dashboard</h1>

<div class="card">

<h2>Select Student</h2>

<select id="studentSelect"></select>

</div>

<div class="card">

<h2>Student Profile</h2>

<p id="studentRank"></p>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

<p id="progressText"></p>

<div class="badge" id="badge"></div>

</div>

<div class="card">

<h2>Assignment History</h2>

<table>

<thead>
<tr>
<th>Task</th>
<th>Status</th>
<th>Submitted At</th>
</tr>
</thead>

<tbody id="taskTable"></tbody>

</table>

</div>

<div class="card">

<h2>🏆 Leaderboard</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Student</th>
<th>Completed</th>
</tr>
</thead>

<tbody id="leaderboard"></tbody>

</table>

</div>

</div>

<script>

const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQisfAjXtdhgNsKx0tRWZfxpKE3ZqnTko7Nza9JI0Kk5F4Syl58jky7G0iOoNy5L5Zzyr9jO16rX1Np/pub?gid=1152285208&single=true&output=csv";


const TASKS = [
"Java Setup",
"Hello World",
"Circle Program",
"Basic Calculator",
"GitHub Repository"
];
let students={};

fetch(SHEET_URL)
.then(res=>res.text())
.then(data=>{

const rows=data.split("\n").slice(1);

rows.forEach(row=>{

const cols=row.split(",");

const time=cols[0];
const name=cols[1];
const assignment=cols[3];

if(!name) return;

if(!students[name]){
students[name]={};
}

students[name][assignment]=time;

});

initDropdown();
buildLeaderboard();

});


function initDropdown(){

const select=document.getElementById("studentSelect");

select.innerHTML="<option>Select student</option>";

Object.keys(students).forEach(name=>{

const opt=document.createElement("option");

opt.value=name;
opt.innerText=name;

select.appendChild(opt);

});

select.addEventListener("change",()=>loadStudent(select.value));

}


function loadStudent(name){

const data=students[name];

const completed=Object.keys(data).length;

const percent=Math.round((completed/TASKS.length)*100);

document.getElementById("progressBar").style.width=percent+"%";

document.getElementById("progressText").innerText=
completed+" / "+TASKS.length+" assignments completed";

updateBadge(completed);

buildTaskTable(name);

showRank(name);

}


function buildTaskTable(name){

const table=document.getElementById("taskTable");

table.innerHTML="";

TASKS.forEach(task=>{

const submitted=students[name][task];

const tr=document.createElement("tr");

const taskLink=submitted
? `<a href="task.html?student=${encodeURIComponent(name)}&task=${encodeURIComponent(task)}" target="_blank">${task}</a>`
: task;

tr.innerHTML=`
<td>${taskLink}</td>
<td>${submitted?"✅ Submitted":"❌ Missing"}</td>
<td>${submitted?submitted:"-"}</td>
`;

table.appendChild(tr);

});

}


function buildLeaderboard(){

const sorted=Object.entries(students)
.map(([name,data])=>[name,Object.keys(data).length])
.sort((a,b)=>b[1]-a[1]);

const table=document.getElementById("leaderboard");

table.innerHTML="";

sorted.forEach((s,i)=>{

let rankClass="";

if(i===0) rankClass="rank1";
if(i===1) rankClass="rank2";
if(i===2) rankClass="rank3";

const tr=document.createElement("tr");

tr.innerHTML=`
<td class="${rankClass}">${i+1}</td>
<td>${s[0]}</td>
<td>${s[1]}</td>
`;

table.appendChild(tr);

});

}


function showRank(name){

const sorted=Object.entries(students)
.map(([n,data])=>[n,Object.keys(data).length])
.sort((a,b)=>b[1]-a[1]);

const rank=sorted.findIndex(s=>s[0]===name)+1;

document.getElementById("studentRank").innerText=
"Rank: #"+rank;

}


function updateBadge(count){

let badge="";

if(count>=4) badge="🥇 Java Master";
else if(count>=3) badge="🥈 Intermediate";
else if(count>=2) badge="🥉 Beginner";
else badge="🚀 Getting Started";

document.getElementById("badge").innerText=badge;

}

</script>

</body>
</html>
