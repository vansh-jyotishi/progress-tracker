<!DOCTYPE html>
<html>
<head>
<title>Java Course Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:40px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#2c3e50;
color:white;
}

</style>
</head>

<body>

<h1>Java Course Leaderboard</h1>

<table id="leaderboard">

<thead>
<tr>
<th>Rank</th>
<th>Student</th>
<th>Assignments Completed</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQisfAjXtdhgNsKx0tRWZfxpKE3ZqnTko7Nza9JI0Kk5F4Syl58jky7G0iOoNy5L5Zzyr9jO16rX1Np/pub?gid=1152285208&single=true&output=csv";

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

const rows=data.split("\n").slice(1);

let students={};

rows.forEach(row=>{

const cols=row.split(",");

const name=cols[1];
const assignment=cols[3];

if(!name) return;

if(!students[name]){
students[name]=new Set();
}

students[name].add(assignment);

});

const sorted=Object.entries(students)
.map(([name,set])=>[name,set.size])
.sort((a,b)=>b[1]-a[1]);

const table=document.querySelector("#leaderboard tbody");

sorted.forEach((s,i)=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${i+1}</td>
<td>${s[0]}</td>
<td>${s[1]}</td>
`;

table.appendChild(tr);

});

});

</script>

</body>
</html>
