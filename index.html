<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Progress Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PapaParse for CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <h2>Syncing Data...</h2>
    </div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-section">
                <div class="logo-icon">
                    <i data-lucide="layout-dashboard" color="white"></i>
                </div>
                <div>
                    <h1>Student Leaderboard</h1>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Real-time progress tracker</p>
                </div>
            </div>
            <div id="last-updated" style="color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="clock" size="16"></i>
                <span>Updated: Just now</span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i data-lucide="users" size="28"></i>
                </div>
                <div class="stat-info">
                    <p>Total Active Students</p>
                    <h3 id="stat-students">0</h3>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--secondary-color);">
                    <i data-lucide="file-code-2" size="28"></i>
                </div>
                <div class="stat-info">
                    <p>Total Submissions</p>
                    <h3 id="stat-submissions">0</h3>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="color: var(--success);">
                    <i data-lucide="trophy" size="28"></i>
                </div>
                <div class="stat-info">
                    <p>Highest Assignments Count</p>
                    <h3 id="stat-highest">0</h3>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            
            <!-- Leaderboard Panel -->
            <div class="section-panel">
                <div class="section-header">
                    <i data-lucide="award" style="color: #fbbf24;"></i>
                    <h2>Top Performers</h2>
                </div>
                <div class="leaderboard-list" id="leaderboard-container">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Status Matrix Panel -->
            <div class="section-panel" style="overflow: hidden;">
                <div class="section-header matrix-header">
                    <div class="header-title">
                        <i data-lucide="check-square" style="color: var(--primary-color);"></i>
                        <h2>Completion Matrix</h2>
                    </div>
                    <div class="matrix-controls">
                        <div class="search-box">
                            <i data-lucide="search" size="18"></i>
                            <input type="text" id="search-input" placeholder="Search student...">
                        </div>
                        <button id="export-btn" class="action-btn">
                            <i data-lucide="download" size="18"></i> Export
                        </button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="matrix-table">
                        <thead id="matrix-table-head">
                            <!-- Dynamically injected headers -->
                        </thead>
                        <tbody id="matrix-table-body">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 1rem; text-align: right; margin-right: 1rem;">
                    <a href="admin.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(59, 130, 246, 0.1); padding: 0.5rem 1rem; border-radius: 8px; transition: background 0.2s;">
                        <i data-lucide="settings" size="16"></i> Admin Panel
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- Student Profile Modal -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <h2 id="modal-student-name">Student Name</h2>
                    <span id="modal-student-roll" class="modal-subtitle">Roll Number</span>
                </div>
                <button class="modal-close" id="modal-close-btn">
                    <i data-lucide="x" size="24"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="modal-stats">
                    <div class="modal-stat-box">
                        <span class="modal-stat-label">Completion</span>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span id="modal-stat-percent" class="modal-stat-value">0%</span>
                            <span id="modal-stat-fraction" style="color: var(--text-muted); font-size: 0.9rem;">(0/0)</span>
                        </div>
                    </div>
                    <div class="modal-stat-box">
                        <span class="modal-stat-label">Last Active</span>
                        <span id="modal-stat-last-active" class="modal-stat-value" style="font-size: 1.1rem;">-</span>
                    </div>
                </div>

                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Submission History</h3>
                <div id="modal-submissions-list" class="submissions-list">
                    <!-- Dynamic Submissions -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
