<!DOCTYPE html>
<html>
<head>
<title>Java Course Dashboard</title>

<style>
body{font-family:Arial;background:#f4f6f8;padding:40px;}
h1{text-align:center;}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:20px;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#2c3e50;
color:white;
}

.progressbar{
height:16px;
background:#ddd;
border-radius:8px;
overflow:hidden;
}

.fill{
height:100%;
background:#4caf50;
}

select{
padding:8px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>Java Course Leaderboard</h1>

<table id="leaderboard">
<thead>
<tr>
<th>Rank</th>
<th>Student</th>
<th>Completed</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Check Your Progress</h2>

<select id="studentSelect"></select>

<div id="progressBox"></div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQisfAjXtdhgNsKx0tRWZfxpKE3ZqnTko7Nza9JI0Kk5F4Syl58jky7G0iOoNy5L5Zzyr9jO16rX1Np/pub?gid=1152285208&single=true&output=csv";

const TASKS=[
"Java Setup",
"Hello World",
"Circle Program",
"Calculator",
"GitHub Repo"
];

let students={};

fetch(SHEET_URL)
.then(res=>res.text())
.then(data=>{

const rows=data.split("\n").slice(1);

rows.forEach(row=>{

const cols=row.split(",");

const name=cols[1];
const assignment=cols[3];

if(!name || !assignment) return;

if(!students[name]){
students[name]=new Set();
}

students[name].add(assignment);

});

buildLeaderboard();
buildStudentSelect();

});


function buildLeaderboard(){

const table=document.querySelector("#leaderboard tbody");

const sorted=Object.entries(students)
.map(([name,set])=>[name,set.size])
.sort((a,b)=>b[1]-a[1]);

sorted.forEach((s,i)=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${i+1}</td>
<td>${s[0]}</td>
<td>${s[1]} / ${TASKS.length}</td>
`;

table.appendChild(tr);

});

}

function buildStudentSelect(){

const select=document.getElementById("studentSelect");

Object.keys(students).forEach(name=>{
const opt=document.createElement("option");
opt.value=name;
opt.textContent=name;
select.appendChild(opt);
});

select.addEventListener("change",showProgress);

}

function showProgress(){

const name=document.getElementById("studentSelect").value;

const done=students[name].size;

const percent=Math.round((done/TASKS.length)*100);

document.getElementById("progressBox").innerHTML=`
<h3>${name}</h3>

<div class="progressbar">
<div class="fill" style="width:${percent}%"></div>
</div>

<p>${done} / ${TASKS.length} tasks completed</p>
`;

}

</script>

</body>
</html>
